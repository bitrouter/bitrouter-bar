name: Package candidate

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: scripts/package-app.sh
      - name: Archive app
        run: ditto -c -k --norsrc --keepParent "dist/BitRouter Bar.app" "dist/BitRouter-Bar.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: BitRouter-Bar-adhoc-candidate
          path: dist/BitRouter-Bar.zip
